<div class="books-layout">

  <div class="books-content">
    <h1>Książki</h1>

    <app-work-list category="books"
                   (workSelected)="selectedWork = $event">
    </app-work-list>

    @if (selectedReviewer) {
    <app-review-list category="books"
                     [title]="selectedWork"
                     [reviewAuthor]="selectedReviewer">
    </app-review-list>
    }
  </div>

  @if (selectedWork) {
  <aside>
    <app-reviewer-list category="books"
                       [title]="selectedWork"
                       (reviewerSelected)="selectedReviewer = $event">
    </app-reviewer-list>
  </aside>
  }

</div>
