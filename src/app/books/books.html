<div class="books-layout">
  <div class="books-content">
    <h1>Książki</h1>
    @if (!showForm) {
    <app-work-list category="books"
                   (workSelected)="selectedWork = $event">
    </app-work-list>

    @if (selectedReviewer) {
    <app-review-list 
                     [workId]="selectedWork"
                     [reviewAuthor]="selectedReviewer">
    </app-review-list>
    }

    }
  </div>
  @if (!showForm) {
  @if (selectedWork) {
  <aside>
    <app-reviewer-list 
                       [workId]="selectedWork"
                       (reviewerSelected)="selectedReviewer = $event">
    </app-reviewer-list>
  </aside>
  }

  }

</div>
@if (!showForm) {
<button (click)="showForm = true">
  Napisz własną recenzję
</button>
}
@if (showForm) {
<section class="review-form-card">
  <app-review-form category="books"></app-review-form>
</section>
}
@if (showForm) {
<button (click)="showForm = false">
  Powrót
</button>
}
